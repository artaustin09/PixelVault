<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PixelVault{% endblock %}</title>
    <style>
        body { font-family: 'Consolas', sans-serif; background-color: #121212; margin: 0; color: #fff; }
        nav { background: #6200ea; padding: 20px; text-align: center; border-bottom: 3px solid #00e5ff; }
        nav a { color: #fff; margin: 0 20px; text-decoration: none; font-size: 1.2em; text-transform: uppercase; letter-spacing: 2px;}
        nav a:hover { color: #00e5ff; }
        .container { padding: 30px; max-width: 1000px; margin: auto; }
        .btn { background: #00e5ff; color: #000; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; border: none; cursor: pointer;}
        .btn:hover { background: #fff; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">🎮 Tienda</a>
        <a href="/admin">⚙️ Admin Console</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
