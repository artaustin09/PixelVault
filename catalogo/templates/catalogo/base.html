<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PixelVault{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        nav {
            background: #111;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #6200ea;
        }
        .logo {
            color: #00e5ff;
            text-decoration: none;
            font-size: 1.8em;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            transition: 0.3s;
        }
        .nav-links a:hover {
            color: #00e5ff;
        }
        .cart-badge {
            background: #ff1744;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.8em;
            vertical-align: top;
            margin-left: 5px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #111;
            border-top: 1px solid #333;
            margin-top: 50px;
            color: #555;
        }
    </style>
</head>
<body>

    <nav>
    <a href="{% url 'home' %}" class="logo">PIXELVAULT</a>
    <div class="nav-links">
        <a href="{% url 'home' %}">TIENDA</a>
        
        {% if user.is_staff %}
            <a href="/admin/" style="color: #ffc107; border: 1px dashed #ffc107; padding: 5px 10px; border-radius: 5px;">
                ⚙ PANEL ADMIN
            </a>
        {% endif %}

        <a href="{% url 'ver_carrito' %}" style="border: 1px solid #00e5ff; padding: 8px 15px; border-radius: 5px;">
            🛒 BÓVEDA 
            {% if request.session.carrito %}
                <span class="cart-badge">{{ request.session.carrito|length }}</span>
            {% endif %}
        </a>
    </div>
</nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2024 PixelVault - Operación de Bóveda Gamer</p>
    </footer>

</body>
</html>
