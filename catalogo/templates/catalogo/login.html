{% extends 'catalogo/base.html' %}
{% block title %}PixelVault - Login{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; background: #1e1e1e; padding: 30px; border-radius: 10px; border: 1px solid #6200ea; text-align: center;">
    <h2 style="color: #00e5ff; margin-top: 0;">Iniciar Sesión</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="color: #aaa; display: block; margin-bottom: 5px;">Usuario:</label>
            <input type="text" name="username" style="width: 100%; padding: 10px; background: #333; color: white; border: 1px solid #6200ea; box-sizing: border-box; border-radius: 5px;">
        </div>
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="color: #aaa; display: block; margin-bottom: 5px;">Contraseña:</label>
            <input type="password" name="password" style="width: 100%; padding: 10px; background: #333; color: white; border: 1px solid #6200ea; box-sizing: border-box; border-radius: 5px;">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Ingresar a la Bóveda</button>
    </form>
</div>
{% endblock %}
